name: BioCloud Workbench CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Backend Automated Testing & Quality Checks
  # ============================================================================
  backend-test:
    name: Backend Pytest & AWS Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install moto[server] pytest-cov

      - name: Initialize local dev environment
        run: |
          python scripts/init_local_aws.py --local

      - name: Run backend unit and integration test suite
        run: |
          python -m pytest backend/tests/ -v --durations=10

  # ============================================================================
  # 2. Frontend Production Build & TypeScript Verification
  # ============================================================================
  frontend-build:
    name: Frontend Build & Lint (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js production build
        run: npm run build

  # ============================================================================
  # 3. Infrastructure Linting & Validation (Terraform)
  # ============================================================================
  terraform-validate:
    name: Terraform Validation & Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform (offline backend)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate
